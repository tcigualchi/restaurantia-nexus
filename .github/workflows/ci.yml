name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus_test
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv sync --frozen --python 3.12
      - name: Ruff (lint + format)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Mypy (strict)
        run: uv run mypy
      - name: Tests (unit, integration, security) with coverage
        run: uv run pytest --cov=nexus --cov-report=term --cov-report=xml
      - name: Migrations are in sync with the models
        env:
          DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Dependency audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --frozen --no-dev --no-hashes)
        shell: bash
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

  web:
    name: Web · lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  e2e:
    name: E2E · featured scenario
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
      APP_ENV: test
      CORS_ORIGINS: http://localhost:3000
      DEMO_MAX_SESSIONS_PER_IP_PER_HOUR: "100"
      DEMO_BURST_PER_MINUTE: "100"
      API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start API and worker
        working-directory: apps/api
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          uv sync --frozen --python 3.12
          uv run alembic upgrade head && uv run nexus-seed
          nohup uv run uvicorn nexus.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          nohup uv run nexus-worker > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/readyz && break; sleep 1; done
      - name: Build and start web
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund && npm run build
          cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ > /dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            apps/api/*.log
            apps/web/web.log

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
